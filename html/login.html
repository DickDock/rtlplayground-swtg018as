<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Login</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--bd:#dfe3e9;--bd2:#cbd2db;--fg:#181d25;--fg2:#626c7a;
  --ac:#2e6fd8;--ac2:#1e5bc0;--acfg:#ffffff;--bad:#cf4437;
  --sel:rgba(46,111,216,.11);
  --shadow-pop:0 2px 6px rgba(15,21,30,.08),0 16px 44px rgba(15,21,30,.16);
  --r:10px;--r-l:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "PingFang SC","Hiragino Sans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --t1:.14s;--ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"]{
  --bg:#0e1217;--panel:#161c24;--bd:#28303c;--bd2:#3a4553;--fg:#dfe6ee;--fg2:#8b98a7;
  --ac:#5b9bf0;--ac2:#7db3f5;--acfg:#07203f;--bad:#ef7166;
  --sel:rgba(91,155,240,.16);
  --shadow-pop:0 2px 6px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 var(--font);color:var(--fg);
  background:radial-gradient(1200px 800px at 50% -10%,color-mix(in srgb,var(--ac) 8%,var(--bg)),var(--bg));
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-l);
  padding:38px 34px;width:min(360px,92vw);box-shadow:var(--shadow-pop);
}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo svg{flex:none;stroke:var(--ac);background:var(--sel);border-radius:10px;padding:6px;box-sizing:content-box}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
input[type=password]{
  width:100%;padding:10px 12px;font-size:15px;color:var(--fg);
  background:var(--panel);border:1px solid var(--bd2);border-radius:var(--r);outline:none;
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease);
}
input[type=password]:hover{border-color:color-mix(in srgb,var(--fg2) 45%,var(--bd2))}
input[type=password]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--sel)}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:var(--r);cursor:pointer;
  transition:background var(--t1) var(--ease),transform var(--t1) var(--ease);
}
button:hover{background:var(--ac2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#err{color:var(--bad);font-size:13px;font-weight:600;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref="auto";
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){}
  var dark=false;
  try{dark=window.matchMedia("(prefers-color-scheme: dark)").matches;}catch(e){}
  document.documentElement.dataset.theme=pref==="dark"||(pref!=="light"&&dark)?"dark":"light";
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form id="lf" method="post" action="login">
    <label for="pwd" id="lp">Password</label>
    <input id="pwd" name="pwd" type="password" autocomplete="current-password" autofocus required
           oninput="document.getElementById('err').textContent=''">
    <button type="submit" id="lb">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
(function(){
  var L={
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong password, try again."],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","密码错误，请重试。"]
  };
  var lang="en";
  try{
    var s=localStorage.getItem("rtl_lang");
    if(s&&L[s])lang=s;
    else{
      var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language];
      for(var i=0;i<list.length;i++){
        var l=String(list[i]||"").toLowerCase();
        if(L[l]){lang=l;break;}
        var b=l.split("-")[0];
        if(L[b]){lang=b;break;}
      }
    }
  }catch(e){}
  var S=L[lang];
  document.title=S[0];
  document.getElementById("hn").textContent=S[0];
  document.getElementById("sub").textContent=S[1];
  document.getElementById("lp").textContent=S[2];
  document.getElementById("lb").textContent=S[3];
  document.getElementById("err").textContent=document.referrer.endsWith("login.html")?S[4]:"";
  document.getElementById("lf").addEventListener("submit",function(e){
    e.preventDefault();
    var err=document.getElementById("err"),btn=document.getElementById("lb");
    btn.disabled=true;err.textContent="";
    /* Content-Type must be set explicitly: left to the fetch default it
     * becomes "application/x-www-form-urlencoded;charset=UTF-8", and the
     * firmware's is_word() does not treat ';' as a separator, so the
     * login is rejected as a bad request. */
    fetch("/login",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({pwd:document.getElementById("pwd").value})})
      .then(function(r){
        var p=new URL(r.url,location.href).pathname;
        if(r.redirected&&/login\.html$/.test(p)){
          err.textContent=S[4];btn.disabled=false;return;
        }
        if(!r.ok&&!r.redirected){err.textContent=S[4];btn.disabled=false;return;}
        location.replace("/");
      })
      .catch(function(){err.textContent=S[4];btn.disabled=false;});
  });
})();
</script>
</body>
</html>
