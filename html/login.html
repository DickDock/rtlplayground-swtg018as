<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交换机登录</title>
<style>
:root{
  --bg:#f2f5f7;--panel:#ffffff;--panel2:#e9eef2;--bd:#dbe2e8;--fg:#1b2732;--fg2:#5d6b78;
  --ac:#0c7a99;--acfg:#ffffff;--bad:#c94a40;
  --sel:rgba(12,122,153,.10);
  --shadow:0 1px 2px rgba(16,34,44,.05),0 4px 14px rgba(16,34,44,.06);
  --shadow-pop:0 2px 6px rgba(16,34,44,.08),0 16px 40px rgba(16,34,44,.16);
  --r-sm:6px;--r-md:8px;--r-xl:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "PingFang SC","Hiragino Sans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --t1:.14s;--ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"]{
  --bg:#0c1116;--panel:#141b22;--panel2:#1c242c;--bd:#2a333d;--fg:#dfe7ee;--fg2:#8a97a4;
  --ac:#4cc4e4;--acfg:#04252e;--bad:#ef6f66;
  --sel:rgba(76,196,228,.13);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.38);
  --shadow-pop:0 2px 6px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
}
:root[data-theme="sel-dark"]{
  --bg:#103c48;--panel:#184956;--panel2:#1f505e;--bd:#2e5d6b;--fg:#b2c5c5;--fg2:#7f949a;
  --ac:#62b6d9;--acfg:#06222b;--bad:#fb6450;
  --sel:rgba(98,182,217,.15);
  --shadow:0 1px 2px rgba(0,10,14,.5),0 4px 14px rgba(0,10,14,.35);
  --shadow-pop:0 2px 6px rgba(0,10,14,.5),0 16px 40px rgba(0,10,14,.5);
}
:root[data-theme="sel-light"]{
  --bg:#fbf3db;--panel:#fffaef;--panel2:#f0e8d2;--bd:#ddd3b9;--fg:#46565c;--fg2:#82908f;
  --ac:#0b6f8e;--acfg:#ffffff;--bad:#c33c42;
  --sel:rgba(11,111,142,.10);
  --shadow:0 1px 2px rgba(90,75,40,.10),0 4px 14px rgba(90,75,40,.10);
  --shadow-pop:0 2px 6px rgba(90,75,40,.12),0 16px 40px rgba(90,75,40,.16);
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 var(--font);color:var(--fg);
  background:radial-gradient(1200px 800px at 50% -10%,color-mix(in srgb,var(--ac) 7%,var(--bg)),var(--bg));
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-xl);
  padding:40px 36px;width:min(360px,92vw);
  box-shadow:var(--shadow-pop);
}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo svg{flex:none;stroke:var(--ac);background:var(--sel);border-radius:10px;padding:6px;box-sizing:content-box}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
input[type=password]{
  width:100%;padding:10px 12px;font-size:15px;color:var(--fg);
  background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-md);outline:none;
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease);
}
input[type=password]:hover{border-color:color-mix(in srgb,var(--fg2) 45%,var(--bd))}
input[type=password]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--sel)}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:var(--r-md);cursor:pointer;
  transition:background var(--t1) var(--ease),transform var(--t1) var(--ease);
}
button:hover{background:color-mix(in srgb,var(--ac) 88%,var(--fg))}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#err{color:var(--bad);font-size:13px;font-weight:600;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref;
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){pref="auto";}
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=pref;
  if(pref==="auto")t=dark?"dark":"light";
  if(pref==="auto-sel")t=dark?"sel-dark":"sel-light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form method="post" action="login">
    <label for="pwd" id="lp">Password</label>
    <input id="pwd" name="pwd" type="password" autocomplete="current-password" autofocus required
           oninput="document.getElementById('err').textContent=''">
    <button type="submit" id="lb">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
(function(){
  var L={
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong password, try again."],
    ja:["スイッチ ログイン","RTLPlayground 管理インターフェース","パスワード","ログイン","パスワードが違います。もう一度お試しください。"],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","密码错误，请重试。"],
    es:["Inicio de sesión del switch","Interfaz de gestión de RTLPlayground","Contraseña","Iniciar sesión","Contraseña incorrecta, inténtalo de nuevo."],
    fr:["Utilisateur du commutateur","Interface de management RTLPlayground","Mot de passe","Se connecter","Mot de passe erronné, essayez à nouveau."]
  };
  var l="zh";
  var s=L[l]||L.en;
  document.title=s[0];
  document.getElementById("hn").textContent=s[0];
  document.getElementById("sub").textContent=s[1];
  document.getElementById("lp").textContent=s[2];
  document.getElementById("lb").textContent=s[3];
  if(document.referrer.endsWith("login.html"))document.getElementById("err").textContent=s[4];
})();
</script>
</body>
</html>
