<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<link rel="icon" href="/favicon.ico">
<script>
/* anti-FOUC: resolve the theme before first paint.
 * priority: ?theme= query (screenshots/testing) > localStorage 'theme' > system */
(function(){
  var pref="auto",q=null;
  try{q=new URLSearchParams(location.search).get("theme");}catch(e){}
  if(q==="light"||q==="dark")pref=q;
  else{try{pref=localStorage.getItem("theme")||"auto";}catch(e){}}
  var dark=false;
  try{dark=window.matchMedia("(prefers-color-scheme: dark)").matches;}catch(e){}
  document.documentElement.dataset.theme=pref==="dark"||(pref!=="light"&&dark)?"dark":"light";
})();
</script>
<style>
/* ===== Obsidian · precision dark · dark-first tokens (same family as index) ===== */
:root{
  color-scheme:dark;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --bg-app:#0B0E14;
  --surface-1:#10141C;
  --surface-2:#161C27;
  --surface-3:#1D2532;
  --input-bg:#0C1018;
  --hairline:#1B2230;
  --hairline-2:#2A3547;
  --grid-line:#151C28;
  --text-1:#E8ECF4;
  --text-2:#A6B0C1;
  --text-3:#7A8596;
  --text-4:#5D697A;
  --accent:#3FB9E8;
  --accent-hover:#6ACCF2;
  --accent-strong:#3FB9E8;
  --accent-ink:#062433;
  --accent-dim:rgba(63,185,232,.13);
  --accent-border:rgba(63,185,232,.40);
  --accent-ring:rgba(63,185,232,.22);
  --glow:rgba(63,185,232,.09);
  --ok:#3ED598;
  --ok-border:rgba(62,213,152,.35);
  --ok-dim:rgba(62,213,152,.12);
  --down:#7B889C;
  --err:#E5484D;
  --err-border:rgba(229,72,77,.40);
  --err-dim:rgba(229,72,77,.13);
  --mask:rgba(4,7,12,.58);
  --shadow-pop:0 24px 70px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.35);
  --r-s:6px;--r:10px;--r-l:14px;
}
[data-theme="light"]{
  color-scheme:light;
  --bg-app:#F2F4F8;
  --surface-1:#FFFFFF;
  --surface-2:#F5F7FA;
  --surface-3:#EBEFF5;
  --input-bg:#FFFFFF;
  --hairline:#E1E6EE;
  --hairline-2:#C8D2E0;
  --grid-line:#E9EEF4;
  --text-1:#17202C;
  --text-2:#4D5A6B;
  --text-3:#5C6B80;
  --text-4:#7A8596;
  --accent:#0B82B0;
  --accent-hover:#095F82;
  /* solid fill tier: white ink on #0B82B0 is only ~4.0:1, use ~5.5:1 #0A7199 */
  --accent-strong:#0A7199;
  --accent-ink:#FFFFFF;
  --accent-dim:rgba(11,130,176,.10);
  --accent-border:rgba(11,130,176,.35);
  --accent-ring:rgba(11,130,176,.16);
  --glow:rgba(11,130,176,.07);
  --ok:#137345;
  --ok-border:rgba(19,115,69,.32);
  --ok-dim:rgba(19,115,69,.09);
  --down:#76828F;
  --err:#C4383E;
  --err-border:rgba(196,56,62,.32);
  --err-dim:rgba(196,56,62,.08);
  --mask:rgba(24,32,46,.38);
  --shadow-pop:0 24px 70px rgba(23,34,51,.14),0 4px 16px rgba(23,34,51,.06);
}
/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.55;
  background:var(--bg-app);color:var(--text-1);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:28px 20px;
}
.mono{font-family:var(--font-mono)}
button,input{font:inherit;color:inherit}
svg{display:block;flex:none}
::selection{background:var(--accent-dim)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* theme-toggle icon swap */
[data-theme="light"] .ic-sun{display:none}
[data-theme="dark"] .ic-moon{display:none}
/* ===== backdrop: faint engineering grid + one soft accent halo ===== */
.backdrop{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg-grid{
  position:absolute;inset:-1px;
  background:
    repeating-linear-gradient(0deg,var(--grid-line) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(90deg,var(--grid-line) 0 1px,transparent 1px 44px);
  -webkit-mask-image:radial-gradient(760px 560px at 50% 44%,#000 25%,transparent 80%);
  mask-image:radial-gradient(760px 560px at 50% 44%,#000 25%,transparent 80%);
}
.bg-glow{
  position:absolute;left:50%;top:-220px;width:920px;height:560px;
  transform:translateX(-50%);
  background:radial-gradient(50% 55% at 50% 45%,var(--glow),transparent 72%);
}
</style>
<style>
/* ===== stage ===== */
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;animation:in .45s cubic-bezier(.4,0,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ===== card ===== */
.card{
  width:min(372px,94vw);
  background:var(--surface-1);
  border:1px solid var(--hairline);
  border-radius:var(--r-l);
  padding:20px 26px 24px;
  box-shadow:var(--shadow-pop);
}
/* hairline accent along the top edge */
.card::before{
  content:"";position:absolute;
}
.card{position:relative}
.card::before{
  top:-1px;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-border),transparent);
}
/* ===== device plate (the visual anchor) ===== */
.device{
  margin-top:14px;padding:10px 12px 8px;
  background:var(--surface-2);border:1px solid var(--hairline);
  border-radius:var(--r);
}
.swsvg{width:100%;height:auto}
.swsvg text{font-family:var(--font-mono);fill:var(--text-4)}
.swsvg .ts{font-size:6px;letter-spacing:.06em}
.swsvg .ts2{font-size:6.5px;letter-spacing:.1em}
.swsvg .tn{font-size:6px;text-anchor:middle}
/* ===== heading ===== */
h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:18px}
p.sub{color:var(--text-3);font-size:12px;margin:3px 0 16px}
/* ===== field ===== */
.flabel{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-3);margin-bottom:6px}
.pw{position:relative}
#pwd{
  width:100%;height:38px;padding:0 42px 0 12px;font-size:14px;
  font-variant-numeric:tabular-nums;
  color:var(--text-1);background:var(--input-bg);
  border:1px solid var(--hairline-2);border-radius:var(--r);outline:none;
  caret-color:var(--accent);
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease;
}
#pwd::placeholder{color:var(--text-4)}
#pwd:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--hairline-2))}
#pwd:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
#pwd.user-invalid{border-color:var(--err-border);box-shadow:0 0 0 3px var(--err-dim)}
#eye{
  position:absolute;top:1px;right:1px;bottom:1px;width:36px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:0 var(--r) var(--r) 0;
  cursor:pointer;color:var(--text-3);
  transition:color .14s ease,background .14s ease;
}
#eye:hover{color:var(--accent);background:var(--surface-2)}
#eye:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* ===== submit ===== */
#lb{
  width:100%;height:38px;margin-top:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  color:var(--accent-ink);background:var(--accent-strong);
  border:1px solid var(--accent-strong);border-radius:var(--r);cursor:pointer;
  transition:background .12s ease,border-color .12s ease,transform .12s ease,opacity .12s ease;
}
#lb:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
#lb:active{transform:translateY(.5px)}
#lb:disabled{opacity:.55;cursor:not-allowed;transform:none}
.spin{
  width:13px;height:13px;flex:none;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--accent-ink) 38%,transparent);
  border-top-color:var(--accent-ink);
  animation:rot .7s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}
/* ===== error ===== */
#err{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:20px;margin-top:11px;
  font-size:12px;font-weight:600;color:var(--err);text-align:center;
}
#err:empty{display:none}
#err.shake{animation:shake .4s cubic-bezier(.4,0,.2,1)}
@keyframes shake{
  20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(3px)}
}
/* ===== foot + theme toggle ===== */
.foot{font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
.tt{
  position:fixed;top:14px;right:14px;z-index:2;
  width:30px;height:30px;display:grid;place-items:center;
  background:none;border:1px solid var(--hairline-2);border-radius:var(--r-s);
  color:var(--text-3);cursor:pointer;
  transition:color .12s ease,border-color .12s ease,background .12s ease;
}
.tt:hover{color:var(--text-1);background:var(--surface-2)}
@media (max-width:420px){
  body{padding:18px 14px}
  .card{padding:18px 20px 20px}
  .tt{top:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true">

</div>

      <g>
        <rect x="76" y="22" width="20" height="19" rx="2.5" fill="var(--surface-3)" stroke="var(--hairline-2)"/><rect x="81" y="25" width="10" height="13" rx="1.2" fill="var(--input-bg)" stroke="var(--hairline)"/><rect x="79" y="45" width="4" height="3" rx="1" fill="var(--ok)"/><rect x="89" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".55"/><text x="86" y="58" class="tn">1</text>
        <rect x="102" y="22" width="20" height="19" rx="2.5" fill="var(--surface-3)" stroke="var(--hairline-2)"/><rect x="107" y="25" width="10" height="13" rx="1.2" fill="var(--input-bg)" stroke="var(--hairline)"/><rect x="105" y="45" width="4" height="3" rx="1" fill="var(--ok)"/><rect x="115" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".55"/><text x="112" y="58" class="tn">2</text>
        <rect x="128" y="22" width="20" height="19" rx="2.5" fill="var(--surface-3)" stroke="var(--hairline-2)"/><rect x="133" y="25" width="10" height="13" rx="1.2" fill="var(--input-bg)" stroke="var(--hairline)"/><rect x="131" y="45" width="4" height="3" rx="1" fill="var(--ok)"/><rect x="141" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".55"/><text x="138" y="58" class="tn">3</text>
        <rect x="154" y="22" width="20" height="19" rx="2.5" fill="var(--surface-3)" stroke="var(--hairline-2)"/><rect x="159" y="25" width="10" height="13" rx="1.2" fill="var(--input-bg)" stroke="var(--hairline)"/><rect x="157" y="45" width="4" height="3" rx="1" fill="var(--ok)"/><rect x="167" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".55"/><text x="164" y="58" class="tn">4</text>
        <rect x="180" y="22" width="20" height="19" rx="2.5" fill="var(--surface-3)" stroke="var(--hairline-2)"/><rect x="185" y="25" width="10" height="13" rx="1.2" fill="var(--input-bg)" stroke="var(--hairline)"/><rect x="183" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".22"/><rect x="193" y="45" width="4" height="3" rx="1" fill="var(--down)" opacity=".22"/><text x="190" y="58" class="tn">5</text>

      </g>

           oninput="var e=document.getElementById('err');e.textContent='';e.classList.remove('shake')">
    <button type="button" id="eye" tabindex="-1" aria-label="Show password">

<p class="foot mono">RTL837x · SWTG018AS · 192.168.31.3</p>
</main>
<script>
(function(){
  var L={
    en:["Sign in","Enter the admin password","Password","Sign in","Wrong password, try again.","Signing in…","Show password","Hide password"],
    zh:["登录","请输入管理密码","密码","登录","密码错误，请重试。","登录中…","显示密码","隐藏密码"]
  };
  var lang="en";
  try{
    var s=localStorage.getItem("rtl_lang");
    if(s&&L[s])lang=s;
    else{
      var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language];
      for(var i=0;i<list.length;i++){
        var l=String(list[i]||"").toLowerCase();
        if(L[l]){lang=l;break;}
        var b=l.split("-")[0];
        if(L[b]){lang=b;break;}
      }
    }
  }catch(e){}
  var S=L[lang];
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.title=S[0];
  document.getElementById("hn").textContent=S[0];
  document.getElementById("sub").textContent=S[1];
  document.getElementById("pl").textContent=S[2];
  document.getElementById("lbt").textContent=S[3];
  var err=document.getElementById("err"),btn=document.getElementById("lb"),
      sp=document.getElementById("sp"),lbt=document.getElementById("lbt"),
      eye=document.getElementById("eye"),pwd=document.getElementById("pwd");
  eye.title=S[6];
  /* a native POST that bounced back from the server lands on login.html again */
  err.textContent=document.referrer.endsWith("login.html")?S[4]:"";

  eye.addEventListener("click",function(){
    var show=pwd.type==="password";
    pwd.type=show?"text":"password";
    document.getElementById("eyeon").style.display=show?"none":"";
    document.getElementById("eyeoff").style.display=show?"":"none";
    eye.title=show?S[7]:S[6];
    eye.setAttribute("aria-label",show?S[7]:S[6]);
    pwd.focus();
  });

  document.getElementById("lf").addEventListener("submit",function(e){
    e.preventDefault();
    btn.disabled=true;err.textContent="";err.classList.remove("shake");
    sp.hidden=false;lbt.textContent=S[5];
    /* Content-Type must be set explicitly: left to the fetch default it
     * becomes "application/x-www-form-urlencoded;charset=UTF-8", and the
     * firmware's is_word() does not treat ';' as a separator, so the
     * login is rejected as a bad request. */
    fetch("/login",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({pwd:pwd.value})})
      .then(function(r){
        var p=new URL(r.url,location.href).pathname;
        if(r.redirected&&/login\.html$/.test(p)){
          fail();return;
        }
        if(!r.ok&&!r.redirected){fail();return;}
        location.replace("/");
      })
      .catch(function(){fail();});
  });
  function fail(){
    btn.disabled=false;
    sp.hidden=true;
    lbt.textContent=S[3];
    err.textContent=S[4];
    err.classList.remove("shake");
    void err.offsetWidth;   /* restart the animation on repeated failures */
    err.classList.add("shake");
  }

  /* theme toggle: flips data-theme and persists to localStorage 'theme' */
  document.getElementById("tt").addEventListener("click",function(){
    var cur=document.documentElement.dataset.theme==="light"?"dark":"light";
    document.documentElement.dataset.theme=cur;
    try{localStorage.setItem("theme",cur);}catch(e){}
  });
})();
</script>
</body>
</html>
